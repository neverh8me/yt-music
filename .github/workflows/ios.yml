# iOS test build: an UNSIGNED .ipa for side-loading on your own iPhone (Sideloadly / AltStore
# re-sign it with a free Apple ID; it then runs for 7 days). No Apple certificate is needed.
# Run it from the Actions tab ("iOS test build" → Run workflow); the .ipa is an artifact of the run.
# The release workflow also calls it and attaches the .ipa to the release as a beta.
name: iOS test build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ios

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The Xcode project calls `cargo tauri ...`; route that to the npm CLI instead of
      # compiling tauri-cli (cargo passes the subcommand name "tauri" as $1).
      - name: cargo-tauri shim
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec npx --yes @tauri-apps/cli@2 "$@"\n' > "$HOME/.local/bin/cargo-tauri"
          chmod +x "$HOME/.local/bin/cargo-tauri"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: xcodegen
        run: brew install xcodegen

      # The Xcode project isn't committed yet; generate it.
      - name: Generate the Xcode project
        working-directory: src-tauri
        # through `cargo tauri` (the shim): the project then calls `cargo tauri` to build the Rust
        # part too (with npx it would call `npm run tauri`, and there is no package.json).
        run: cargo tauri ios init --ci

      # No Apple account in CI: switch code signing off in the generated project itself
      # (tauri's xcodebuild call doesn't pass an XCODE_XCCONFIG_FILE through).
      - name: Disable code signing
        working-directory: src-tauri/gen/apple
        run: |
          PBX="$(ls -d *.xcodeproj)/project.pbxproj"
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/buildSettings = {/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; CODE_SIGN_ENTITLEMENTS = ""; PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            "$PBX"
          # The "Build Rust Code" phase calls the CLI the way it was started; under npx that is
          # `npm run -- tauri`, which needs a package.json. Call the cargo shim instead.
          sed -i '' -e 's/npm run -- tauri/cargo tauri/g' -e 's/npm run tauri/cargo tauri/g' "$PBX"
          [ -f project.yml ] && sed -i '' -e 's/npm run -- tauri/cargo tauri/g' -e 's/npm run tauri/cargo tauri/g' project.yml
          grep -o "[a-z ]*tauri ios xcode-script" "$PBX" | sort -u
          grep -c "CODE_SIGNING_ALLOWED = NO" "$PBX"
          grep -n "CODE_SIGN_STYLE\|DEVELOPMENT_TEAM" "$PBX" | head

      # rquickjs-sys (via rustypipe) generates its iOS bindings with bindgen → Xcode's libclang.
      # Signing is switched off for every target through an xcconfig that xcodebuild always
      # reads (XCODE_XCCONFIG_FILE), with no team and manual (empty) signing, so Xcode doesn't
      # look for an Apple account; the unsigned .app is packed into an .ipa by hand below.
      - name: Build (unsigned)
        working-directory: src-tauri
        run: |
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          export LIBCLANG_PATH="$TOOLCHAIN/usr/lib"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="--target=arm64-apple-ios14.0 -isysroot $(xcrun --sdk iphoneos --show-sdk-path)"
          cat > "$RUNNER_TEMP/nosign.xcconfig" <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_ENTITLEMENTS =
          CODE_SIGN_STYLE = Manual
          PROVISIONING_PROFILE_SPECIFIER =
          PROVISIONING_PROFILE =
          DEVELOPMENT_TEAM =
          EOF
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/nosign.xcconfig"
          cargo tauri ios build --ci --target aarch64 2>&1 | tee "$RUNNER_TEMP/build.log" || true
          APP="$(find gen/apple "$HOME/Library/Developer/Xcode/DerivedData" \( -path '*.xcarchive/Products/Applications/*.app' -o -path '*-iphoneos/*.app' \) -type d -prune 2>/dev/null | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::no .app in the archive (see the build log above)"
            grep -nE "error:|error\[|failed" "$RUNNER_TEMP/build.log" | tail -40 || true
            exit 1
          fi
          echo "App: $APP"
          # a failed build can leave an empty .app behind: require the executable
          if [ -z "$(find "$APP" -maxdepth 1 -type f -perm -u+x -size +1M)" ]; then
            echo "::error::the .app has no executable (build failed)"
            grep -nE "error:|error\[|failed" "$RUNNER_TEMP/build.log" | tail -40 || true
            exit 1
          fi
          VERSION="$(node -p "require('./tauri.conf.json').version")"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/YT.Music_${VERSION}_iOS-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE"/*.ipa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-ipa
          path: "*.ipa"
          retention-days: 14
