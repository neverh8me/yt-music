name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Third-party actions are pinned to full commit SHAs (supply-chain safety:
# the android job handles the release signing key). Comments show the version.
jobs:
  # Fail fast if any frontend module doesn't even parse (it would ship a blank UI).
  check-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax-check ui/*.js as ES modules
        run: |
          t="$(mktemp -d)"
          for f in ui/*.js; do cp "$f" "$t/$(basename "${f%.js}").mjs"; node --check "$t/$(basename "${f%.js}").mjs"; done

  # Release notes: the commits since the last published (non-draft) release.
  notes:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.log.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changelog
        id: log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV="$(gh release list --exclude-drafts --limit 20 --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -1)"
          RANGE="${PREV:+$PREV..}$GITHUB_REF_NAME"
          {
            echo 'body<<NOTES_EOF'
            echo "## What's new"
            echo
            git log --no-merges --reverse --pretty='- %s' "$RANGE"
            echo
            echo '## Downloads'
            echo
            echo '| Platform | File |'
            echo '|---|---|'
            echo '| Windows | `*_Windows-x64-setup.exe` |'
            echo '| macOS (Apple Silicon: M1/M2/M3/M4) | `*_macOS-Apple-Silicon.dmg` |'
            echo '| macOS (Intel) | `*_macOS-Intel.dmg` |'
            echo '| Linux (Debian/Ubuntu) | `*_Linux-x64.deb` |'
            echo '| Android | `*_Android.apk` |'
            echo
            echo 'macOS builds are not notarized: right-click the app → Open the first time.'
            echo
            echo 'Unofficial YouTube Music client. Not affiliated with Google LLC.'
            [ -n "$PREV" ] && echo && echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_REF_NAME"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [check-ui, notes]
    # Manual runs (workflow_dispatch) only check the Android build.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        # `asset`: file names that say which platform they are for
        include:
          - platform: windows-latest
            args: ''
            asset: 'YT.Music_[version]_Windows-x64[setup][ext]'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            asset: 'YT.Music_[version]_macOS-Apple-Silicon[ext]'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            asset: 'YT.Music_[version]_macOS-Intel[ext]'
          - platform: ubuntu-22.04
            args: '--bundles deb'
            asset: 'YT.Music_[version]_Linux-x64[ext]'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles; tauri-action then uploads *.sig + latest.json for the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YT Music ${{ github.ref_name }}'
          releaseBody: ${{ needs.notes.outputs.body }}
          assetNamePattern: ${{ matrix.asset }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      # Without signing secrets (e.g. in a fork) skip the Android build instead of failing the release.
      # Only check for the secret here; the key itself is decoded right before the build,
      # after all third-party actions have run.
      - name: Check signing secret
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, skipping the Android build"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.sign.outputs.ok == 'true'

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.sign.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.sign.outputs.ok == 'true'
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.sign.outputs.ok == 'true'
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.sign.outputs.ok == 'true'
        with:
          node-version: 22

      # rquickjs-sys (via rustypipe) generates its Android bindings with bindgen.
      # libclang must match the NDK's clang (NDK 27 ships clang 18).
      - name: libclang 18
        if: steps.sign.outputs.ok == 'true'
        run: sudo apt-get update && sudo apt-get install -y libclang-18-dev

      # The Gradle project calls `cargo tauri ...`; route that to the npm CLI instead of
      # compiling tauri-cli (cargo passes the subcommand name "tauri" as $1).
      - name: cargo-tauri shim
        if: steps.sign.outputs.ok == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec npx --yes @tauri-apps/cli@2 "$@"\n' > "$HOME/.local/bin/cargo-tauri"
          chmod +x "$HOME/.local/bin/cargo-tauri"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode signing key
        if: steps.sign.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.sign.outputs.ok == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          NDK="$(ls -d "$ANDROID_HOME"/ndk/27.* | sort -V | tail -1)"
          echo "Using NDK $NDK"
          export NDK_HOME="$NDK"
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          # bindgen detects include paths by asking a clang binary; point it at the
          # NDK's clang, otherwise the host's glibc headers leak into the Android build.
          export CLANG_PATH="$TC/bin/clang"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$TC/sysroot"
          cd src-tauri
          npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 --ci

      - name: Upload to release
        if: steps.sign.outputs.ok == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)"
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$APK" "YT.Music_${VERSION}_Android.apk"
          gh release upload "$GITHUB_REF_NAME" "YT.Music_${VERSION}_Android.apk" --clobber
