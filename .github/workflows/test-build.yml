# Desktop test build: the same bundles as a release, but nothing is published. No tag, no
# release, no update feed: the files are artifacts of the run (kept 14 days).
# Run it from the Actions tab ("Desktop test build" → Run workflow), on any branch.
name: Desktop test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows-x64
            args: ''
          - platform: macos-latest
            name: macOS-Apple-Silicon
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build
        shell: bash
        env:
          # The bundle config asks for signed update artifacts, so the build needs the key
          # even though nothing here is published.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri
          npx --yes @tauri-apps/cli@2 build --ci ${{ matrix.args }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YT.Music_test_${{ matrix.name }}
          # installers, plus the bare Windows program (runs without installing)
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/release/ytubem.exe
          retention-days: 14
          if-no-files-found: error

  # Same steps as the android job in release.yml, but the APK stays an artifact of the run.
  # It is signed with the release key so it installs over the published app.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: libclang 18
        run: sudo apt-get update && sudo apt-get install -y libclang-18-dev

      - name: cargo-tauri shim
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec npx --yes @tauri-apps/cli@2 "$@"\n' > "$HOME/.local/bin/cargo-tauri"
          chmod +x "$HOME/.local/bin/cargo-tauri"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Decoded only here, after all third-party actions have run.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          NDK="$(ls -d "$ANDROID_HOME"/ndk/27.* | sort -V | tail -1)"
          echo "Using NDK $NDK"
          export NDK_HOME="$NDK"
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CLANG_PATH="$TC/bin/clang"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$TC/sysroot"
          cd src-tauri
          npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 --ci
          APK="$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)"
          cp "$APK" "$GITHUB_WORKSPACE/YT.Music_test_Android.apk"

      # The upload action runs after the build, so drop the key first.
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YT.Music_test_Android
          path: YT.Music_test_Android.apk
          retention-days: 14
          if-no-files-found: error
