<title>YT Music Stage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: one screen. Stage (now playing) is home; layers (library, history…) open over it and the
   stage collapses into a capsule player that never leaves. Tokens = PR #1 glass theme (ui/theme-glass.css). */
:root {
  color-scheme: dark;
  --bg: #050507;
  --surface: rgba(255,255,255,.04);
  --surface-hover: rgba(255,255,255,.08);
  --surface-active: rgba(255,255,255,.12);
  --surface-dense: rgba(11,11,15,.82);
  --stroke: rgba(255,255,255,.09);
  --stroke-strong: rgba(255,255,255,.18);
  --text: #f5f5f7;
  --muted: #9a9aa6;
  --dim: #6c6c78;
  --accent: #3ddc84;
  --accent-hi: #6ae8a2;
  --on-light: #050507;
  --danger: #ff5c6c;
  --art-0: #ff8a3d; --art-1: #5b8cff; --art-2: #3ddc84; --art-3: #ff5c6c; --art-4: #9e73ff; --art-5: #ffcc4d;
  --scrim: rgba(0,0,0,.55);
  --shadow: rgba(0,0,0,.5);

  --font: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --fs-display: clamp(32px, 4.2vw, 48px);
  --fs-title: 26px; --fs-heading: 18px; --fs-body: 14px; --fs-caption: 12px; --fs-mono: 11px;

  --r-xs: 8px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 24px; --r-full: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s12: 48px;
  --blur: blur(32px) saturate(140%);
  --ease: cubic-bezier(.2,.8,.2,1);
  --morph: 320ms;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-body)/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
.mono { font: 500 var(--fs-mono)/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 26px; height: 26px; }

/* ---------- shell */
#app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; overflow: clip; }
#ambient { position: absolute; inset: 0; pointer-events: none; opacity: .9; transition: background 600ms var(--ease);
  background: radial-gradient(60% 55% at 12% 8%, color-mix(in srgb, var(--c1) 30%, transparent), transparent 70%),
              radial-gradient(50% 50% at 55% 45%, color-mix(in srgb, var(--c2) 18%, transparent), transparent 70%); }
body[data-mode="browse"] #ambient { opacity: .45; }

#topbar { position: relative; z-index: 5; display: grid; grid-template-columns: 1fr minmax(0, 520px) 1fr; align-items: center; gap: var(--s4);
  padding: var(--s6) var(--gutter-r) var(--s3) var(--gutter-l); }
.brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.brand b { font-size: var(--fs-heading); font-weight: 600; letter-spacing: -.01em; }
.iconbtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-full); color: var(--muted); }
.iconbtn:hover { background: var(--surface-hover); color: var(--text); }
.iconbtn[aria-pressed="true"] { color: var(--accent); }
#back[hidden] { display: none; }
.search { display: flex; align-items: center; gap: var(--s3); height: 40px; padding: 0 var(--s3) 0 var(--s4); border-radius: var(--r-full);
  background: var(--surface); border: 1px solid var(--stroke); transition: border-color 160ms; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); }
.search input::placeholder { color: var(--muted); }
kbd { font: 500 var(--fs-mono)/1 var(--mono); color: var(--muted); border: 1px solid var(--stroke-strong); border-radius: var(--r-xs); padding: 3px 6px; }
.top-right { display: flex; justify-content: flex-end; align-items: center; gap: var(--s2); }
.avatar { width: 36px; height: 36px; border-radius: var(--r-full); display: grid; place-items: center; font-weight: 600; color: var(--on-light);
  background: linear-gradient(135deg, var(--art-2), var(--art-1)); }
#search-btn { display: none; }

/* ---------- stage */
#stage { position: relative; z-index: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s12);
  padding: var(--s6) var(--gutter-r) 190px var(--gutter-l); overflow: auto; transition: opacity var(--morph) var(--ease), transform var(--morph) var(--ease); }
body[data-mode="browse"] #stage { opacity: 0; transform: translateY(40px) scale(.98); pointer-events: none; visibility: hidden;
  transition: opacity var(--morph) var(--ease), transform var(--morph) var(--ease), visibility 0s var(--morph); }
.now { display: flex; gap: 40px; align-items: center; min-width: 0; }
.art { border-radius: var(--r-md); background: linear-gradient(135deg, var(--a1), var(--a2)); flex: none; }
#stage-art { width: clamp(220px, 28vw, 360px); aspect-ratio: 1; border-radius: var(--r-lg); box-shadow: 0 30px 60px -20px var(--shadow); touch-action: none; cursor: grab; }
.now-meta { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; flex: 1; max-width: 560px; }
.now-meta h1 { font-size: var(--fs-display); line-height: 1.05; letter-spacing: -.03em; font-weight: 700; overflow-wrap: anywhere; }
.now-meta .artist { font-size: var(--fs-heading); color: var(--muted); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--stroke-strong); width: fit-content; }
.now-meta .artist:hover { color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 12px; border-radius: var(--r-full); border: 1px solid var(--stroke);
  background: var(--surface); color: var(--text); font-weight: 500; white-space: nowrap; }
.chip:hover { background: var(--surface-hover); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip .ic { color: var(--muted); }
.chip[aria-pressed="true"] .ic, .chip.liked .ic { color: var(--accent); }
.tabs { display: flex; gap: var(--s2); flex-wrap: wrap; }
.tab { height: 34px; padding: 0 14px; border-radius: var(--r-full); border: 1px solid var(--stroke); color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"], .tab[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--on-light); }

/* range inputs (seek / volume / EQ) */
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 18px; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(var(--text), var(--text)) 0/var(--p, 0%) 100% no-repeat, var(--surface-hover); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--surface-hover); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); margin-top: -4px; opacity: 0; transition: opacity 120ms; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text); }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { opacity: 1; }
.seek { display: grid; gap: 4px; }
.seek input { width: 100%; }
.times { display: flex; justify-content: space-between; font: 500 var(--fs-mono)/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.transport { display: flex; align-items: center; gap: var(--s3); flex-wrap: nowrap; }
.transport .vol { margin-left: var(--s3); }
.play { display: grid; place-items: center; width: 64px; height: 64px; border-radius: var(--r-full); background: var(--text); color: var(--on-light); flex: none; transition: transform 120ms; }
.play:hover { transform: scale(1.04); }
.play .ic { width: 28px; height: 28px; }
.tbtn { color: var(--text); display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-full); }
.tbtn:hover { background: var(--surface-hover); }
.tbtn.minor { color: var(--muted); }
.tbtn[aria-pressed="true"] { color: var(--accent); }
.vol { display: flex; align-items: center; gap: var(--s2); color: var(--muted); }
.vol input { width: 96px; }

/* up next / lyrics side */
.side { min-width: 0; display: flex; flex-direction: column; gap: var(--s2); }
.side-head { display: flex; justify-content: space-between; align-items: baseline; }
.side-head h2 { font-size: var(--fs-heading); }
.lyrics { display: flex; flex-direction: column; gap: var(--s4); padding-top: var(--s2); }
.lyrics button { text-align: left; font-size: var(--fs-heading); font-weight: 600; color: var(--dim); line-height: 1.3; transition: color 200ms, font-size 200ms; }
.lyrics button.past { color: var(--dim); }
.lyrics button.next { color: var(--muted); }
.lyrics button.cur { color: var(--text); font-size: 24px; }
.lyrics button:hover { color: var(--text); }
.note { font-size: var(--fs-caption); color: var(--dim); }

/* track rows */
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto auto; align-items: center; gap: var(--s3); padding: var(--s2) var(--s2) var(--s2) var(--s2);
  border-radius: var(--r-sm); cursor: pointer; user-select: none; }
.row:hover { background: var(--surface-hover); }
.row.cur { background: var(--surface-hover); }
.row.cur .t { color: var(--accent); }
.row .art { width: 40px; height: 40px; border-radius: var(--r-xs); position: relative; display: grid; place-items: center; }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .a { font-size: var(--fs-caption); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d { font: 500 var(--fs-mono)/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row .rb { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-full); color: var(--muted); opacity: .0; }
.row:hover .rb, .row:focus-within .rb, .row .rb.on, .row .rb:focus-visible { opacity: 1; }
.row .rb.on { color: var(--accent); }
.row .rb:hover { color: var(--text); background: var(--surface-hover); }
.row.dragging { opacity: .4; }
.row.drop { box-shadow: 0 -2px 0 var(--accent) inset; }
.eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.eq i { width: 3px; background: var(--on-light); border-radius: 1px; animation: eq 900ms ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -300ms; } .eq i:nth-child(3) { animation-delay: -600ms; }
.paused .eq i { animation-play-state: paused; }
@keyframes eq { 0%,100% { height: 4px } 50% { height: 14px } }

/* ---------- dock (stage mode) */
#dock { position: absolute; z-index: 3; left: 16px; right: 16px; bottom: 0; padding: 10px var(--s6) calc(var(--s5) + env(safe-area-inset-bottom, 0px));
  border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--surface-dense); border: 1px solid var(--stroke); border-bottom: 0;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); display: flex; flex-direction: column; gap: var(--s3);
  transition: transform var(--morph) var(--ease), opacity var(--morph) var(--ease); }
body[data-mode="browse"] #dock { transform: translateY(110%); opacity: 0; pointer-events: none; }
.handle { align-self: center; width: 40px; height: 4px; border-radius: 4px; background: var(--stroke-strong); }
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); }
.tile { display: flex; align-items: center; gap: var(--s3); padding: var(--s2); padding-right: var(--s4); border-radius: var(--r-md); background: var(--surface); text-align: left; min-width: 0; }
.tile:hover { background: var(--surface-hover); }
.tile .art { width: 52px; height: 52px; border-radius: var(--r-sm); }
.tile b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { display: block; font-size: var(--fs-caption); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile > div { min-width: 0; }

/* ---------- browse view */
#view { position: absolute; z-index: 2; inset: 76px 0 0 0; overflow: auto; padding: var(--s2) var(--gutter-r) 120px var(--gutter-l);
  opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity var(--morph) var(--ease), transform var(--morph) var(--ease); }
body[data-mode="browse"] #view { opacity: 1; transform: none; pointer-events: auto; }
.page { display: flex; flex-direction: column; gap: var(--s8); max-width: 1216px; margin: 0 auto; }
.section { display: flex; flex-direction: column; gap: var(--s3); }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s4); }
.sh h2 { font-size: var(--fs-heading); }
.link { color: var(--muted); font-weight: 500; }
.link:hover { color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s5); }
.card { display: flex; flex-direction: column; gap: var(--s2); text-align: left; min-width: 0; padding: var(--s2); margin: calc(-1 * var(--s2)); border-radius: var(--r-md); }
.card:hover { background: var(--surface); }
.card .art { width: 100%; aspect-ratio: 1; max-width: 100%; position: relative; }
.card.round .art { border-radius: 50%; }
.card b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card span { font-size: var(--fs-caption); color: var(--muted); margin-top: -6px; }
.card .cplay { position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%; background: var(--text); color: var(--on-light); display: grid; place-items: center;
  opacity: 0; transform: translateY(6px); transition: opacity 160ms, transform 160ms; }
.card:hover .cplay, .card:focus-within .cplay { opacity: 1; transform: none; }
.hero { display: flex; gap: var(--s8); align-items: flex-end; flex-wrap: wrap; }
.hero .art { width: 220px; aspect-ratio: 1; border-radius: var(--r-lg); max-width: 100%; box-shadow: 0 30px 60px -24px var(--shadow); }
.hero h1 { font-size: var(--fs-display); letter-spacing: -.03em; line-height: 1.05; font-weight: 700; }
.hero-meta { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; flex: 1; }
.by { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; color: var(--muted); }
.by a { color: var(--text); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--stroke-strong); cursor: pointer; }
.actions { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.actions .play { width: 52px; height: 52px; }
.actions .play .ic { width: 22px; height: 22px; }
.banner { position: relative; margin: -8px calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l)); padding: 120px var(--gutter-r) var(--s6) var(--gutter-l);
  background: linear-gradient(180deg, color-mix(in srgb, var(--a1) 55%, transparent), transparent), linear-gradient(90deg, color-mix(in srgb, var(--a2) 35%, transparent), transparent); }
.banner .inner { max-width: 1216px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s3); }
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--s12); }
.layers-bar { display: flex; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.toprow { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--s8); }
.best { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s5); border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--stroke); text-align: left; }
.best .art { width: 120px; height: 120px; }
.best h3 { font-size: var(--fs-title); letter-spacing: -.02em; }
.stat { display: flex; gap: var(--s6); flex-wrap: wrap; }
.stat div { display: flex; flex-direction: column; }
.stat b { font-size: var(--fs-title); font-variant-numeric: tabular-nums; }
.daylabel { margin-top: var(--s3); }

/* states */
.skel { display: flex; flex-direction: column; gap: var(--s5); max-width: 1216px; margin: 0 auto; }
.sk { border-radius: var(--r-sm); background: linear-gradient(90deg, var(--surface) 0%, var(--surface-hover) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0 } }
.empty { display: grid; justify-items: center; text-align: center; gap: var(--s3); padding: var(--s12) var(--s4); border: 1px dashed var(--stroke-strong); border-radius: var(--r-lg); }
.empty h2 { font-size: var(--fs-heading); }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.empty .big { width: 48px; height: 48px; color: var(--dim); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: var(--r-full); background: var(--text); color: var(--on-light); font-weight: 600; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--stroke); }
.btn.danger { background: var(--danger); color: var(--on-light); }

/* ---------- capsule */
#capsule { position: absolute; z-index: 6; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(780px, calc(100% - 32px)); height: 72px;
  transform: translate(-50%, 140%); opacity: 0; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4) 0 10px; overflow: hidden;
  border-radius: var(--r-full); background: var(--surface-dense); border: 1px solid var(--stroke-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: 0 16px 40px var(--shadow); transition: transform var(--morph) var(--ease), opacity var(--morph) var(--ease); touch-action: none; }
body[data-mode="browse"] #capsule { transform: translate(-50%, 0); opacity: 1; }
#cap-art { width: 52px; height: 52px; border-radius: 50%; }
.cap-meta { flex: 1; min-width: 0; cursor: pointer; text-align: left; }
.cap-meta b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap-meta span { font-size: var(--fs-caption); color: var(--muted); font-variant-numeric: tabular-nums; }
#capsule .play { width: 44px; height: 44px; }
#capsule .play .ic { width: 18px; height: 18px; }
.cap-div { width: 1px; height: 28px; background: var(--stroke); }
#cap-progress { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }
.ghost-art { position: fixed; z-index: 50; pointer-events: none; }

/* ---------- overlays */
.pop { position: absolute; z-index: 20; min-width: 260px; padding: var(--s2); border-radius: var(--r-md); background: var(--surface-dense); border: 1px solid var(--stroke-strong);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: 0 24px 48px var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.mi { display: flex; align-items: center; gap: var(--s3); padding: 10px var(--s3); border-radius: var(--r-sm); text-align: left; width: 100%; color: var(--text); }
.mi:hover, .mi:focus-visible { background: var(--surface-hover); outline: none; }
.mi .ic { color: var(--muted); }
.mi.danger { color: var(--danger); } .mi.danger .ic { color: var(--danger); }
.mi kbd { margin-left: auto; }
.sep { height: 1px; background: var(--stroke); margin: 4px 0; }
.acct-head { display: flex; gap: var(--s3); align-items: center; padding: var(--s3); }
.acct-head .avatar { width: 44px; height: 44px; font-size: 18px; }
.acct-head small { display: block; color: var(--muted); }
.scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); display: grid; place-items: center; padding: var(--s4); }
.sheet { width: min(720px, 100%); max-height: calc(100% - 32px); overflow: auto; border-radius: var(--r-xl); background: var(--surface-dense); border: 1px solid var(--stroke-strong);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: 0 30px 80px var(--shadow); padding: var(--s6); display: flex; flex-direction: column; gap: var(--s5); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
.sheet-head h2 { font-size: var(--fs-title); letter-spacing: -.02em; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--surface-active); flex: none; transition: background 160ms; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform 160ms var(--ease); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-light); }
.bands { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: var(--s2); align-items: end; }

function go(delta) {
  if (S.repeat === 'one' && delta === 1) { S.pos = 0; paintTime(); return; }
  let i = S.idx + delta;
  if (delta < 0 && S.pos > 3) { S.pos = 0; paintTime(); return; }
  if (S.shuffle && delta > 0) i = Math.floor(Math.random() * S.queue.length);
  if (i >= S.queue.length) i = S.repeat === 'all' ? 0 : S.queue.length - 1;
  if (i < 0) i = 0;
  S.idx = i; S.pos = 0; S.playing = true; paintNow();
}

  S.pos = 0; S.playing = true; paintNow();
}

    document.body.appendChild(g); morphing = true; b.style.visibility = 'hidden';
    const dx = r2.left - r1.left, dy = r2.top - r1.top, s = r2.width / r1.width;

function open(name, arg) {
  route = [name, arg];
  if (name !== 'search') document.body.classList.remove('searching');
  if (app.dataset.mode !== 'browse') morph('browse');
  view.innerHTML = skeleton();
  const html = (VIEWS[name] || VIEWS.foryou)(arg ?? '');
  const show = () => { view.innerHTML = html; view.scrollTop = 0; for (const t of $$('#dock-tabs .tab')) t.setAttribute('aria-selected', t.dataset.layer === name); };
  if (name === 'search') show(); else setTimeout(show, 260);
  const hashName = { foryou: 'for-you', library: 'library', history: 'history', offline: 'offline', search: 'search', album: 'album', artist: 'artist', playlist: 'playlist', prefs: 'prefs' }[name];
  if (hashName && location.hash !== '#' + hashName) history.replaceState(null, '', '#' + hashName);
}
function navTo(to) {
  const [k, v] = to.split(':');

  else if (k === 'liked') open('playlist', 'liked'); else if (k === 'layer') open(v); else if (k === 'radio') startRadio();
}

// ---------- events
app.addEventListener('click', e => {
  const el = e.target.closest('button, [data-play], [data-to], a');
  if (!el) { if (e.target.closest('[data-scrim]') && !e.target.closest('.sheet')) closeOverlay(); return; }
  const d = el.dataset;
  if (el.closest('.pop') || d.close !== undefined) closeOverlay();
  if (d.act === 'toggle') { S.playing = !S.playing; paintPlay(); document.title = S.playing ? `${cur().t} · ${cur().a}` : 'YT Music Stage'; return; }
  if (d.act === 'next') return go(1);
  if (d.act === 'prev') return go(-1);
  if (d.like) { e.stopPropagation(); S.liked.has(d.like) ? S.liked.delete(d.like) : S.liked.add(d.like); saveLiked(); const on = S.liked.has(d.like); el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); el.innerHTML = on ? ICON.heartF : ICON.heart; if (d.like === cur().id) paintNow(); toast(on ? 'Додано у вподобане' : 'Прибрано з вподобаного'); return; }
  if (d.menu) { e.stopPropagation(); return trackMenu(d.menu, el); }
  if (d.remove) { e.stopPropagation(); S.queue.splice(+d.remove, 1); renderSide(); if ($('#queue-sheet')) queueSheet(); return; }
  if (d.playnext) { e.stopPropagation(); const i = S.queue.indexOf(d.playnext); if (i > -1 && i !== S.idx) { S.queue.splice(i, 1); if (i < S.idx) S.idx--; } if (S.queue[S.idx] !== d.playnext) S.queue.splice(S.idx + 1, 0, d.playnext); renderSide(); return toast(`«${byId[d.playnext].t}» гратиме наступним`); }
  if (d.enqueue) { S.queue.push(d.enqueue); renderSide(); return toast('Додано в кінець черги'); }
  if (d.addto) return setTimeout(() => addToMenu(d.addto, $('#avatar')), 0);
  if (d.addPl) { const p = PLAYLISTS.find(x => x.id === d.addPl); if (!p.tracks.includes(d.track)) p.tracks.push(d.track); return toast(`Додано до «${p.t}»`); }
  if (d.radioOf) { const i = S.queue.indexOf(d.radioOf); S.idx = i > -1 ? i : S.idx; if (i < 0) { S.queue.splice(S.idx + 1, 0, d.radioOf); S.idx++; } S.pos = 0; return startRadio(); }
  if (d.download) { const ids = d.download.split(','); const all = ids.every(i => S.offline.has(i)); ids.forEach(i => all ? S.offline.delete(i) : S.offline.add(i)); return toast(all ? 'Видалено із завантаженого' : `Завантажується: ${ids.length} ${ids.length === 1 ? 'трек' : 'треків'}`); }
  if (d.copy) { const url = `https://music.youtube.com/watch?v=${d.copy}`; const ok = () => toast('Посилання скопійовано'); try { navigator.clipboard.writeText(url).then(ok, () => toast(url)); } catch { toast(url); } return; }
  if (d.playlist) { const list = d.playlist.split(','); S.shuffle = false; return playTrack(list[0], list, d.ctx); }
  if (d.shufflelist) { const list = d.shufflelist.split(',').sort(() => Math.random() - .5); S.shuffle = true; $('#shuffle').setAttribute('aria-pressed', true); playTrack(list[0], list, 'Перемішано'); return; }
  if (d.playctx) { e.stopPropagation(); const list = listOf(d.playctx); return playTrack(list[0], list, el.getAttribute('aria-label').replace('Грати ', '')); }
  if (d.play && !e.target.closest('.rb')) { const host = el.closest('[data-reorder], .rows'); const list = host ? $$('[data-play]', host).map(r => r.dataset.play) : null; return playTrack(d.play, list && !host.closest('#side') && !host.closest('#queue-sheet') ? list : null, route ? (route[0] === 'album' ? (ALBUMS.find(a => a.id === route[1]) || {}).t : null) || S.ctx : S.ctx); }
  if (d.to) { e.preventDefault(); return navTo(d.to); }
  if (d.layer) return open(d.layer);
  if (d.stage !== undefined) return toStage();
  if (d.open === 'eq') return eqSheet();
  if (d.open === 'queue') return queueSheet();
  if (d.newpl !== undefined) return newPlaylist();
  if (d.sync !== undefined) return toast('Бібліотеку синхронізовано: +3 треки');
  if (d.update !== undefined) return toast('Встановлено останню версію');
  if (d.goPrefs !== undefined) return open('prefs');
  if (d.switchAcct !== undefined) return toast('Відкриється вікно входу Google, щоб обрати інший акаунт');
  if (d.signout !== undefined) return setTimeout(confirmSignout, 0);
  if (d.signoutYes !== undefined) { closeOverlay(); return toast('Ти вийшов з акаунта'); }
  if (d.focusSearch !== undefined) return focusSearch();
  if (d.sleep !== undefined) return toast('Таймер сну: музика зупиниться через 30 хв');
  if (d.playliked !== undefined) { const l = [...S.liked]; return l.length ? playTrack(l[0], l, 'Вподобані') : toast('Ще немає вподобаних треків'); }
  if (d.clearq !== undefined) { S.queue = [cur().id]; S.idx = 0; renderSide(); queueSheet(); return toast('Чергу очищено'); }
  if (d.retry !== undefined) { demo = null; store.set('demo', null); return open('search', $('#q').value); }
  if (d.clearRecent !== undefined) return toast('Історію пошуку очищено');
  if (d.follow !== undefined) { const on = el.getAttribute('aria-pressed') !== 'true'; el.setAttribute('aria-pressed', on); el.lastChild.textContent = on ? 'Стежиш' : 'Стежити'; return; }
  if (d.pref) { store.set(d.pref, d.val); if (d.pref === 'demo') { demo = d.val === 'off' ? null : d.val; store.set('demo', demo); } for (const b of $$(`[data-pref="${d.pref}"]`)) b.setAttribute('aria-pressed', b === el); return; }
  if (d.switch) { const on = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', on); store.set(d.switch, on); return; }
  if (d.line) { S.pos = (+d.line / LYRICS.length) * cur().d + 1; return paintTime(); }
  if (el.id === 'avatar') return $('#avatar').getAttribute('aria-expanded') === 'true' ? closeOverlay() : accountMenu();
  if (el.id === 'like' || el.id === 'cap-like') { const id = cur().id; S.liked.has(id) ? S.liked.delete(id) : S.liked.add(id); saveLiked(); paintNow(); return toast(S.liked.has(id) ? 'Додано у вподобане' : 'Прибрано з вподобаного'); }
  if (el.id === 'add-pl') return addToMenu(cur().id, el);
  if (el.id === 'radio') return startRadio();
  if (el.id === 'lyr-btn' || el.id === 'cap-lyrics') { S.lyrics = el.id === 'cap-lyrics' ? true : !S.lyrics; $('#lyr-btn').setAttribute('aria-pressed', S.lyrics); renderSide(); if (el.id === 'cap-lyrics') toStage(); return; }
  if (el.id === 'shuffle') { S.shuffle = !S.shuffle; el.setAttribute('aria-pressed', S.shuffle); return toast(S.shuffle ? 'Перемішування увімкнено' : 'Перемішування вимкнено'); }
  if (el.id === 'repeat') { S.repeat = { off: 'all', all: 'one', one: 'off' }[S.repeat]; el.setAttribute('aria-pressed', S.repeat !== 'off'); const lbl = { off: 'вимкнено', all: 'уся черга', one: 'один трек' }[S.repeat]; el.setAttribute('aria-label', 'Повтор: ' + lbl); el.title = 'Повтор: ' + lbl; return toast('Повтор: ' + lbl); }
  if (el.id === 'cap-open' || el.id === 'cap-expand' || el.id === 'back') return toStage();
  if (el.id === 'search-btn') return focusSearch();
  if (el.id === 'now-artist') { e.preventDefault(); return open('artist'); }
});
app.addEventListener('keydown', e => { const r = e.target.closest('.row[role=button]'); if (r && (e.key === 'Enter' || e.key === ' ') && e.target === r) { e.preventDefault(); r.click(); } });

// drag & drop reorder (queue + playlists)
let dragI = null;
app.addEventListener('dragstart', e => { const r = e.target.closest('.row[draggable]'); if (!r) return; dragI = +r.dataset.i; r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
app.addEventListener('dragend', e => { $$('.row.dragging, .row.drop').forEach(r => r.classList.remove('dragging', 'drop')); dragI = null; });
app.addEventListener('dragover', e => { const r = e.target.closest('.row[draggable]'); if (!r || dragI == null) return; e.preventDefault(); $$('.row.drop').forEach(x => x.classList.remove('drop')); r.classList.add('drop'); });
app.addEventListener('drop', e => {
  const r = e.target.closest('.row[draggable]'); if (!r || dragI == null) return; e.preventDefault(); const to = +r.dataset.i;
  const pl = r.closest('[data-reorder]');
  if (pl) { const p = PLAYLISTS.find(x => x.id === pl.dataset.reorder); const [m] = p.tracks.splice(dragI, 1); p.tracks.splice(to, 0, m); open('playlist', p.id); return; }
  const [m] = S.queue.splice(dragI, 1); S.queue.splice(to, 0, m); renderSide(); if ($('#queue-sheet')) queueSheet(); toast('Порядок черги змінено');
});
app.addEventListener('input', e => { if (e.target.matches('[data-rename]')) { const p = PLAYLISTS.find(x => x.id === route[1]); if (p) p.t = e.target.textContent; } });

// search
const q = $('#q');
function focusSearch() { document.body.classList.add('searching'); q.focus(); open('search', q.value); }
q.addEventListener('focus', () => { if (!route || route[0] !== 'search') open('search', q.value); });
q.addEventListener('input', () => open('search', q.value));
q.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('#view .best'); if (b) b.click(); } });

// keyboard
addEventListener('keydown', e => {
  const typing = e.target.matches('input, textarea, [contenteditable]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' || (!typing && e.key === '/')) { e.preventDefault(); return focusSearch(); }
  if (e.key === 'Escape') { if (overlay.firstChild) return closeOverlay(); if (typing) { e.target.blur(); } if (app.dataset.mode === 'browse') return toStage(); return open('foryou'); }
  if (typing) return;
  if (e.key === ' ' && !e.target.closest('button, [role=button], [role=slider], input')) { e.preventDefault(); S.playing = !S.playing; paintPlay(); }
  if (e.ctrlKey && e.key === 'ArrowRight') go(1);
  if (e.ctrlKey && e.key === 'ArrowLeft') go(-1);
  if (overlay.querySelector('.pop') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const items = $$('.pop .mi'); const i = items.indexOf(document.activeElement); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
});
document.addEventListener('pointerdown', e => { const p = overlay.querySelector('.pop'); if (p && !p.contains(e.target) && !e.target.closest('#avatar')) closeOverlay(); });

// hash routing (bookmarkable views)
function fromHash() {
  const h = location.hash.slice(1);
  const map = { 'for-you': () => open('foryou'), library: () => open('library'), history: () => open('history'), offline: () => open('offline'), search: () => focusSearch(), album: () => open('album', 'al1'), artist: () => open('artist'), playlist: () => open('playlist', 'pl1'), prefs: () => open('prefs') };
  if (map[h]) map[h]();
}
paintNow();
fromHash();
addEventListener('hashchange', fromHash);
})();
</script>
