<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YT Music</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme-boot.js"></script>
</head>
<body data-mode="stage">
  <!-- Stage layout: the playing track is home ("stage"). Library, search and pages open as
       layers over it, and the stage collapses into the capsule player, which never leaves. -->
  <div id="ambient" aria-hidden="true"></div>

  <div id="app">
    <header id="topbar">
      <div class="brand">
        <button class="iconbtn" id="nav-back" data-i18n-title="nav.back" hidden><i data-icon="chev-left"></i></button>
        <b class="brand-name">YT Music</b>
      </div>
      <div class="search-wrap">
        <i data-icon="search"></i>
        <input id="search-input" type="search" data-i18n-ph="top.searchPh" autocomplete="off" spellcheck="false">
        <kbd class="kbd-hint">Ctrl K</kbd>
        <div id="suggest" class="suggest hidden"></div>
      </div>
      <div class="top-right">
        <button class="iconbtn" id="search-btn" data-i18n-title="nav.search"><i data-icon="search"></i></button>
        <button class="pill-btn update-btn hidden" id="update-btn" data-act="install-update"></button>
        <button class="avatar" id="avatar" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>

    <main id="stage">
      <div class="stage-idle">
        <h1 data-i18n="stage.idle"></h1>
        <p class="muted" data-i18n="stage.idleSub"></p>
        <button class="pill-btn primary big" data-nav="home" data-i18n="stage.browse"></button>
      </div>
      <section class="now">
        <div class="stage-art-wrap"><img id="stage-art" class="stage-art" alt="" draggable="false"></div>
        <div class="now-meta">
          <div class="mono" id="stage-ctx"></div>
          <h1 id="stage-title"></h1>
          <div class="stage-artist" id="stage-artist"></div>
          <div class="chips">
            <button class="chip" id="np-like" aria-pressed="false"><i data-icon="heart"></i><span></span></button>
            <button class="chip" id="np-add"><i data-icon="plus"></i><span data-i18n="chip.add"></span></button>
            <button class="chip" id="np-radio"><i data-icon="radio"></i><span data-i18n="chip.radio"></span></button>
            <button class="chip" id="np-lyrics" aria-pressed="false"><i data-icon="mic"></i><span data-i18n="rp.lyrics"></span></button>
            <span id="np-quality" class="qpill"></span>
          </div>
          <div class="seek">
            <input id="seek" type="range" min="0" max="1000" value="0" step="1" data-i18n-aria="pl.position">
            <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
          </div>
          <div class="transport">
            <button class="tbtn minor" id="btn-shuffle" aria-pressed="false" data-i18n-title="pl.shuffle"><i data-icon="shuffle"></i></button>
            <button class="tbtn" id="btn-prev" data-i18n-title="pl.prev"><i data-icon="prev"></i></button>
            <button class="play" id="btn-play" data-i18n-title="pl.play"><i data-icon="play"></i></button>
            <button class="tbtn" id="btn-next" data-i18n-title="pl.next"><i data-icon="next"></i></button>
            <button class="tbtn minor" id="btn-repeat" aria-pressed="false" data-i18n-title="pl.repeat"><i data-icon="repeat"></i></button>
            <div class="vol">
              <button class="tbtn minor" id="btn-mute" data-i18n-title="pl.volume"><i data-icon="volume"></i></button>
              <input id="vol" type="range" min="0" max="100" value="80" data-i18n-aria="pl.volumeLevel">
            </div>
            <button class="tbtn minor sleep-btn" id="btn-sleep" data-i18n-title="sleep.title"><i data-icon="moon"></i><span id="sleep-left"></span></button>
            <button class="tbtn minor" data-act="open-eq" data-i18n-title="eq.title"><i data-icon="sliders"></i></button>
          </div>
        </div>
      </section>
      <aside class="side" id="side"></aside>
    </main>

    <nav id="dock">
      <div class="handle" aria-hidden="true"></div>
      <div class="tabs" id="dock-tabs"></div>
      <div class="shelf" id="dock-shelf"></div>
    </nav>

    <section id="main"><div id="view"></div></section>

    <section id="capsule">
      <img id="cap-art" class="cap-art" alt="">
      <button class="cap-meta" id="cap-open" data-i18n-aria="cap.expand"><b id="cap-title"></b><span id="cap-sub"></span></button>
      <button class="tbtn wide" id="cap-like" data-i18n-title="pl.like"><i data-icon="heart"></i></button>
      <button class="tbtn wide" id="cap-prev" data-i18n-title="pl.prev"><i data-icon="prev"></i></button>
      <button class="play" id="cap-play" data-i18n-title="pl.play"><i data-icon="play"></i></button>
      <button class="tbtn" id="cap-next" data-i18n-title="pl.next"><i data-icon="next"></i></button>
      <span class="cap-div wide" aria-hidden="true"></span>
      <button class="tbtn minor wide" id="cap-queue" data-i18n-title="pl.queue"><i data-icon="queue"></i></button>
      <button class="tbtn minor wide" id="cap-lyrics" data-i18n-title="pl.lyrics"><i data-icon="mic"></i></button>
      <button class="tbtn minor wide" data-act="open-eq" data-i18n-title="eq.title"><i data-icon="sliders"></i></button>
      <button class="tbtn minor wide" id="cap-expand" data-i18n-title="cap.expand"><i data-icon="chev-up"></i></button>
      <div id="cap-progress" aria-hidden="true"></div>
    </section>
  </div>

  <div id="overlay"></div>
  <div id="ctxmenu" class="ctxmenu hidden" role="menu"></div>
  <div id="modal-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>

  <script type="module" src="app.js"></script>
</body>
</html>
